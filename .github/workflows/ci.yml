name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Ignore executable-bit-only noise: Windows commits may store 0644 while
      # scripts/build.mjs chmodSyncs dist/cli.js to 0755 on Linux runners.
      - run: git -c core.fileMode=false diff --exit-code -- dist
      - run: npm run test:cli
      - run: npm audit --audit-level=moderate
